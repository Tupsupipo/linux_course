<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viikko 5 – LLM-chat (CI/CD)</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<!-- data-base = alipolku (esim. /viikko5), jota app.js käyttää API-kutsuissa -->
<body data-base="{{ request.script_root }}">
  <main class="chat">
    <header class="chat__header">
      <div>
        <h1>LLM-chat</h1>
        <p class="chat__meta">Malli: <code>{{ model }}</code> · Nginx → Gunicorn/Flask → Ollama · MySQL</p>
      </div>
      <div class="chat__actions">
        <button type="button" id="new-chat" class="btn btn--ghost">Uusi keskustelu</button>
        <nav class="link-menu" aria-label="Hyödylliset linkit">
          <button type="button" id="links-toggle" class="btn btn--ghost"
                  aria-expanded="false" aria-controls="links-panel">Linkit</button>
          <div id="links-panel" class="link-menu__panel" hidden>
            <ul>
              <li><a href="http://195.148.21.118/viikko5/documents.html">Documents</a></li>
              <li><a href="https://github.com/Tupsupipo/linux_course/tree/main/viikko5">GitHub</a></li>
              <li><a href="http://195.148.21.118">Week one</a></li>
              <li><a href="http://195.148.21.118/viikko2">Week 2</a></li>
              <li><a href="http://195.148.21.118/viikko3">Week 3</a></li>
              <li><a href="http://86.50.252.37/viikko4/">Week 4</a></li>
            </ul>
          </div>
        </nav>
      </div>
    </header>

    <section id="messages" class="chat__messages" aria-live="polite">
      <p class="chat__empty" id="empty-hint">Kirjoita viesti alle aloittaaksesi keskustelun.</p>
    </section>

    <form id="chat-form" class="chat__form" autocomplete="off">
      <textarea id="message" name="message" rows="2" maxlength="2000"
                placeholder="Kirjoita viesti… (Enter lähettää, Shift+Enter rivinvaihto)" required></textarea>
      <button type="submit" id="send" class="btn">Lähetä</button>
    </form>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
